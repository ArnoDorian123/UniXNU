# ruyi image pipeline: kernel -> package -> payload -> firmware -> boot.img
#
# Add this file to your fork of UniXNU as .github/workflows/ruyi-image.yml.
# The stock macos.yml only covers kernel/userdata/payload; the UEFI firmware volume and the
# Android boot image need the EDK II tree and the Mu-Silicium port, which this workflow adds.
#
# Run it in two phases:
#   1. with_firmware = false  -> kernel + EDK II package + device tree merge
#   2. with_firmware = true   -> also builds the payload, SILICIUM_UEFI.fd and boot.img
#
# Revision 8:
#   - links the UEFI checkout into the device tree, which the payload helpers expect
#   - locates DarwinBootPkg and prints its FILE_GUID and Depex
#   - reports the payload image contents instead of patching a stage directory that no longer
#     exists after packing (that step used to fail the job)
#   - a failure step greps the firmware log for the actual EDK II error

name: ruyi image

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: UniXNU/UniXNU-sheng
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: Defconfig name
        required: true
        default: ruyi_defconfig
      uefi_repository:
        description: Mu-Silicium port repository as owner/name
        required: false
        default: ""
      uefi_ref:
        description: Mu-Silicium port ref (branch inside that repository)
        required: false
        default: sheng
      with_firmware:
        description: Build the UEFI firmware volume and boot.img
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ruyi-image-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  image:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - name: Checkout Mu-Silicium port
        if: inputs.with_firmware
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.uefi_repository }}
          ref: ${{ inputs.uefi_ref }}
          path: uefi
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - name: Link the UEFI tree into the device repository
        if: inputs.with_firmware
        run: |
          ln -sfn "$GITHUB_WORKSPACE/uefi" device/uefi-sheng
          ls -l device/uefi-sheng/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib/Font.h

      - name: Report the Mu-Silicium tree
        if: inputs.with_firmware
        run: |
          echo "== head =="
          git -C uefi log --oneline -1
          echo "== Binaries submodule (required by APRIORI.inc) =="
          if [ -d uefi/Binaries/sheng ]; then
            echo "uefi/Binaries/sheng present"
            ls uefi/Binaries/sheng | head -20
          else
            echo "MISSING uefi/Binaries/sheng"
            ls -la uefi/Binaries 2>/dev/null || echo "no uefi/Binaries directory at all"
          fi
          echo "== platform package =="
          ls uefi/Platforms/Xiaomi/shengPkg | head -30
          echo "== device config =="
          ls -l uefi/Resources/Configs/ruyi.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm lld mtools dtc nasm || true

          LLVM_PREFIX="$(brew --prefix llvm)"
          LLVM_BIN="$LLVM_PREFIX/bin"
          LLD_PREFIX="$(brew --prefix lld 2>/dev/null || echo "$LLVM_PREFIX")"
          LLD_BIN="$LLD_PREFIX/bin"

          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          echo "$LLD_BIN" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

          # EDK II CLANGPDB links with lld-link. Homebrew has shipped it both inside the llvm
          # keg and in a separate lld formula, so look in both and pin it into /usr/local/bin,
          # which is always on PATH.
          for candidate in "$LLD_BIN/lld-link" "$LLVM_BIN/lld-link" \
                           "$LLD_BIN/ld.lld" "$LLVM_BIN/ld.lld" \
                           "$LLD_BIN/lld"    "$LLVM_BIN/lld"; do
            if [ -x "$candidate" ]; then
              echo "lld-link resolved from: $candidate"
              sudo ln -sf "$candidate" /usr/local/bin/lld-link
              break
            fi
          done

          if [ ! -x /usr/local/bin/lld-link ]; then
            echo "no lld binary in the llvm/lld kegs; installing the standalone formula"
            brew install lld
            LLD_BIN="$(brew --prefix lld)/bin"
            echo "$LLD_BIN" >> "$GITHUB_PATH"
            sudo ln -sf "$LLD_BIN/lld-link" /usr/local/bin/lld-link
          fi

      - name: Verify host tools
        run: |
          for tool in clang clang++ lld-link llvm-ar cmake ninja unifdef mtools dtc nasm xcodebuild; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done
          echo "--- lld-link --version"
          lld-link --version || echo "lld-link --version failed"

      - name: Select the device
        run: |
          ./unixnu defconfig "${{ inputs.defconfig }}" -D "$GITHUB_WORKSPACE/device"
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily edk2 -D "$GITHUB_WORKSPACE/device"

      - name: Merge the device tree
        run: |
          mkdir -p out/dtb
          test -f device/dtb/ruyi-soc.dtb
          test -f device/dtb/ruyi-board.dtbo
          fdtoverlay -i device/dtb/ruyi-soc.dtb -o out/dtb/ruyi.dtb device/dtb/ruyi-board.dtbo
          ls -l out/dtb/ruyi.dtb

      - name: Build kernel
        run: ./unixnu build kernel

      - name: Build EDK II package
        run: ./unixnu build package

      - name: Build payload
        if: inputs.with_firmware
        run: |
          mkdir -p out/ruyi/tree
          ln -sfn "$GITHUB_WORKSPACE/uefi" out/ruyi/tree/uefi-sheng
          ./unixnu build payload

      - name: Report the payload image
        if: inputs.with_firmware
        run: |
          IMG=out/ruyi/payload/payload.img
          ls -l "$IMG" || true
          echo "== image contents =="
          mdir -/ -i "$IMG" ::/ 2>&1 | head -40 || true

      - name: Build firmware
        if: inputs.with_firmware
        run: ./unixnu build firmware --uefi "$GITHUB_WORKSPACE/uefi"

      - name: Locate DarwinBootPkg
        if: inputs.with_firmware
        run: |
          echo "== package directories =="
          find . -maxdepth 5 -type d -name 'DarwinBootPkg' 2>/dev/null || echo "not found"
          echo "== DarwinBoot.inf =="
          find . -name 'DarwinBoot.inf' 2>/dev/null | head -5 || true
          echo "== FILE_GUID and Depex =="
          for f in $(find . -name 'DarwinBoot.inf' 2>/dev/null | head -3); do
            echo "--- $f"
            grep -iE 'FILE_GUID|Depex|DEPS' "$f" || true
          done

      - name: Report firmware contents
        if: inputs.with_firmware
        run: |
          echo "== module objects =="
          ls -l uefi/Build/ruyiPkg/DEBUG_CLANGPDB/AARCH64/*.efi 2>/dev/null | head -40 || true
          echo "== paint driver =="
          find uefi/Build/ruyiPkg -iname '*RuyiPaint*' -print 2>/dev/null || echo "NOT FOUND"
          echo "== simple fb driver =="
          find uefi/Build/ruyiPkg -iname '*SimpleFb*' -print 2>/dev/null || echo "NOT FOUND"
          echo "== fd =="
          ls -l uefi/Build/ruyiPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd 2>/dev/null || echo "NO FD"
          echo "== fd module names (compressed volume) =="
          strings uefi/Build/ruyiPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd 2>/dev/null \
            | grep -iE 'RuyiPaint|SimpleFb|UniXNU|Sheng' | sort -u | head -30 || true

      - name: Show firmware errors
        if: failure() && inputs.with_firmware
        run: |
          LOG=out/ruyi/logs/firmware.log
          if [ -f "$LOG" ]; then
            echo "=== EDK2 errors ==="
            grep -nE ": error |error [0-9A-F]{4}|Failed to |not found" "$LOG" | tail -40 || true
            echo "=== tail ==="
            tail -30 "$LOG"
          else
            echo "no $LOG"
          fi

      - name: Pack the boot image
        if: inputs.with_firmware
        run: |
          if [ ! -f out/dtb/ruyi.dtb ]; then
            echo "out/dtb/ruyi.dtb missing; cannot pack boot.img" >&2
            exit 1
          fi
          ./unixnu bootimg --uefi "$GITHUB_WORKSPACE/uefi" --dtb out/dtb/ruyi.dtb

      - name: Report what was produced
        if: always()
        run: |
          ls -lhR out/*/kernel out/*/package out/*/boot out/dtb 2>/dev/null | head -80 || true

      - name: Upload kernel, package and firmware
        uses: actions/upload-artifact@v4
        with:
          name: ruyi-image
          path: |
            out/*/kernel/**
            out/*/package/**
            out/*/payload/**
            out/*/boot/**
            out/*/userdata/**
            out/*/logs/**
            out/dtb/**
          if-no-files-found: warn
          retention-days: 7
