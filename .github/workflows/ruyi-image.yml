# ruyi image pipeline: kernel -> package -> payload -> firmware -> boot.img
#
# Add this file to your fork of UniXNU as .github/workflows/ruyi-image.yml.
#
# Revision 9:
#   - imports the sheng boot-progress kit before the kernel build, so the kernel can draw its own
#     entry bar and panic text on the frame buffer
#   - keeps only the steps needed to produce boot.img; the earlier debugging reports (payload
#     listing, firmware module listing, DarwinBoot lookup) are gone
#   - links the uefi checkout into the device tree, which the payload and kernel helpers expect

name: ruyi image

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: UniXNU/UniXNU-sheng
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: Defconfig name
        required: true
        default: ruyi_defconfig
      uefi_repository:
        description: Mu-Silicium port repository as owner/name
        required: false
        default: ""
      uefi_ref:
        description: Mu-Silicium port ref (branch inside that repository)
        required: false
        default: sheng
      with_firmware:
        description: Build the UEFI firmware volume and boot.img
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ruyi-image-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  image:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - name: Checkout Mu-Silicium port
        if: inputs.with_firmware
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.uefi_repository }}
          ref: ${{ inputs.uefi_ref }}
          path: uefi
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - name: Link the UEFI tree into the device repository
        if: inputs.with_firmware
        run: |
          ln -sfn "$GITHUB_WORKSPACE/uefi" device/uefi-sheng
          ls -l device/uefi-sheng/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib/Font.h

      - name: Import the sheng boot-progress kit
        run: |
          git clone --depth 1 https://github.com/UniXNU/UniXNU-sheng /tmp/sheng
          mkdir -p device/kits/ruyi device/scripts
          cp -R /tmp/sheng/kits/sheng/. device/kits/ruyi/
          cp /tmp/sheng/scripts/build-boot-progress.py device/scripts/build-boot-progress.py
          for f in $(grep -rl 'kits/sheng' device/kits/ruyi device/scripts/build-boot-progress.py 2>/dev/null); do
            sed -i '' 's#kits/sheng#kits/ruyi#g' "$f"
          done
          echo "== imported kit =="
          ls -l device/kits/ruyi | head -20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm lld mtools dtc nasm || true

          LLVM_PREFIX="$(brew --prefix llvm)"
          LLVM_BIN="$LLVM_PREFIX/bin"
          LLD_PREFIX="$(brew --prefix lld 2>/dev/null || echo "$LLVM_PREFIX")"
          LLD_BIN="$LLD_PREFIX/bin"

          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          echo "$LLD_BIN" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

          # EDK II CLANGPDB links with lld-link. Homebrew has shipped it both inside the llvm
          # keg and in a separate lld formula, so look in both and pin it into /usr/local/bin,
          # which is always on PATH.
          for candidate in "$LLD_BIN/lld-link" "$LLVM_BIN/lld-link" \
                           "$LLD_BIN/ld.lld" "$LLVM_BIN/ld.lld" \
                           "$LLD_BIN/lld"    "$LLVM_BIN/lld"; do
            if [ -x "$candidate" ]; then
              echo "lld-link resolved from: $candidate"
              sudo ln -sf "$candidate" /usr/local/bin/lld-link
              break
            fi
          done

          if [ ! -x /usr/local/bin/lld-link ]; then
            echo "no lld binary in the llvm/lld kegs; installing the standalone formula"
            brew install lld
            LLD_BIN="$(brew --prefix lld)/bin"
            echo "$LLD_BIN" >> "$GITHUB_PATH"
            sudo ln -sf "$LLD_BIN/lld-link" /usr/local/bin/lld-link
          fi

      - name: Verify host tools
        run: |
          for tool in clang clang++ lld-link llvm-ar cmake ninja unifdef mtools dtc nasm xcodebuild; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done
          lld-link --version || echo "lld-link --version failed"

      - name: Select the device
        run: |
          ./unixnu defconfig "${{ inputs.defconfig }}" -D "$GITHUB_WORKSPACE/device"
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily edk2 -D "$GITHUB_WORKSPACE/device"

      - name: Merge the device tree
        run: |
          mkdir -p out/dtb
          test -f device/dtb/ruyi-soc.dtb
          test -f device/dtb/ruyi-board.dtbo
          fdtoverlay -i device/dtb/ruyi-soc.dtb -o out/dtb/ruyi.dtb device/dtb/ruyi-board.dtbo
          ls -l out/dtb/ruyi.dtb

      - name: Build kernel
        run: ./unixnu build kernel

      - name: Build EDK II package
        run: ./unixnu build package

      - name: Build payload
        if: inputs.with_firmware
        run: |
          mkdir -p out/ruyi/tree
          ln -sfn "$GITHUB_WORKSPACE/uefi" out/ruyi/tree/uefi-sheng
          ./unixnu build payload

      - name: Build firmware
        if: inputs.with_firmware
        run: ./unixnu build firmware --uefi "$GITHUB_WORKSPACE/uefi"

      - name: Show firmware errors
        if: failure() && inputs.with_firmware
        run: |
          LOG=out/ruyi/logs/firmware.log
          if [ -f "$LOG" ]; then
            echo "=== EDK2 errors ==="
            grep -nE ": error |error [0-9A-F]{4}|Failed to |not found" "$LOG" | tail -40 || true
            echo "=== tail ==="
            tail -30 "$LOG"
          else
            echo "no $LOG"
          fi

      - name: Pack the boot image
        if: inputs.with_firmware
        run: |
          if [ ! -f out/dtb/ruyi.dtb ]; then
            echo "out/dtb/ruyi.dtb missing; cannot pack boot.img" >&2
            exit 1
          fi
          ./unixnu bootimg --uefi "$GITHUB_WORKSPACE/uefi" --dtb out/dtb/ruyi.dtb

      - name: Report what was produced
        if: always()
        run: |
          ls -lh out/*/boot/boot.img 2>/dev/null || true
          ls -lh out/*/kernel/kernel.macho 2>/dev/null || true

      - name: Upload boot image and logs
        uses: actions/upload-artifact@v4
        with:
          name: ruyi-image
          path: |
            out/*/boot/**
            out/*/logs/**
            out/dtb/**
          if-no-files-found: warn
          retention-days: 7
